events {}

http {
    error_log /dev/stderr info;
    
    server {
        listen 8080;
        absolute_redirect off;

        # Auth service
        location = /api/v1/auth {
            return 404;
        }

        location /api/v1/auth/ {
            proxy_pass https://adorbitauthentication.onrender.com;
            proxy_ssl_server_name on;
            proxy_ssl_name adorbitauthentication.onrender.com;

            proxy_set_header Host adorbitauthentication.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Users service
        location = /api/v1/users {
            proxy_pass https://adorbitusers.onrender.com/api/v1/users;
            proxy_ssl_server_name on;
            proxy_ssl_name adorbitusers.onrender.com;

            proxy_set_header Host adorbitusers.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /api/v1/users/ {
            proxy_pass https://adorbitusers.onrender.com;
            proxy_ssl_server_name on;
            proxy_ssl_name adorbitusers.onrender.com;

            proxy_set_header Host adorbitusers.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}