events {}

http {
    server {
        listen 8080;

        location /api/v1/auth/ {
            proxy_pass https://adorbitauthentication.onrender.com;
            proxy_ssl_server_name on;
        }

        location /api/v1/users/ {
            proxy_pass https://adorbitusers.onrender.com;
            proxy_ssl_server_name on;
        }
    }
}